<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f4f7f5; font-family: Arial, sans-serif; color: #17201b">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 28px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border-radius: 16px;
              border: 1px solid #dfe7e2;
            "
          >
            <tr>
              <td style="padding: 28px">
                <p style="margin: 0; color: #167a42; font-size: 14px; font-weight: 700">
                  THE FREE SCHOOL FOUNDATION
                </p>
                <h1 style="margin: 16px 0 8px; font-size: 26px">Reset your portal password</h1>
                <p style="margin: 0 0 22px; line-height: 1.6; color: #56625b">
                  Use the secure link below to create a new password for your scholarship portal.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #167a42;
                    color: #ffffff;
                    text-decoration: none;
                    font-weight: 700;
                    padding: 13px 20px;
                    border-radius: 9px;
                  "
                  >Reset my password</a
                >
                <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.5; color: #6b756f">
                  If you did not request a password reset, ignore this email and keep your current
                  password.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
