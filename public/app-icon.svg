<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#167a42"/>
      <stop offset="100%" stop-color="#0f592f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fba94b"/>
      <stop offset="100%" stop-color="#e06d10"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#072d17" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <circle cx="256" cy="256" r="198" fill="#ffffff" filter="url(#dropShadow)"/>

  <!-- Inner Content -->
  <g transform="translate(0, -10)">
    <!-- Graduation Cap / Scholar Motif -->
    <path d="M 256 120 L 376 175 L 256 230 L 136 175 Z" fill="#167a42"/>
    <polygon points="256,120 376,175 256,230 136,175" fill="url(#bgGrad)"/>
    
    <!-- Cap Brim & Tassel -->
    <path d="M 180 200 L 180 248 C 180 282, 332 282, 332 248 L 332 200 L 256 235 Z" fill="#0f592f"/>
    <path d="M 350 186 L 366 265 C 366 275, 355 285, 355 295" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="355" cy="300" r="8" fill="#e06d10"/>

    <!-- Open Book / Wings of Knowledge in Gold -->
    <g transform="translate(256, 310)">
      <!-- Left Page -->
      <path d="M -10 0 C -45 -18, -95 -12, -120 18 L -120 85 C -95 62, -45 56, -10 70 Z" fill="url(#goldGrad)"/>
      <!-- Right Page -->
      <path d="M 10 0 C 45 -18, 95 -12, 120 18 L 120 85 C 95 62, 45 56, 10 70 Z" fill="url(#goldGrad)"/>
      <!-- Book Spine Center -->
      <path d="M -10 0 L 0 -12 L 10 0 L 10 70 L 0 60 L -10 70 Z" fill="#c45804"/>
    </g>

    <!-- Foundation Star of Excellence -->
    <path d="M 256 252 L 260 263 L 272 263 L 262 270 L 266 281 L 256 274 L 246 281 L 250 270 L 240 263 L 252 263 Z" fill="#ffffff"/>
  </g>

  <!-- Foundation Brand Tagline Arc / Base Badge -->
  <rect x="96" y="400" width="320" height="42" rx="21" fill="url(#bgGrad)"/>
  <text x="256" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">FREE SCHOOL</text>
</svg>
